name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Установка JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Тесты
        run: ./gradlew test

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Настройка Buildx
        uses: docker/setup-buildx-action@v4

      - name: Определение короткого SHA и имени образа
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          # реестр требует имя целиком в нижнем регистре, а в имени репозитория есть заглавные
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Сборка образа (без публикации) с кэшированием слоёв
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:build-${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # закреплено по SHA коммита: тег можно переписать, SHA — нет
      - name: Установка Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0

      - name: Полный отчёт Trivy
        run: trivy image --format table --output trivy-report.txt "$IMAGE:$SHORT_SHA"

      - name: Генерация SBOM (CycloneDX)
        run: trivy image --format cyclonedx --output sbom.cdx.json "$IMAGE:$SHORT_SHA"

      - name: Quality Gate — CRITICAL/HIGH с доступным исправлением
        run: trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$IMAGE:$SHORT_SHA"

      - name: Сохранение отчёта Trivy
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Сохранение SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Вход в GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация образа
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:build-${{ github.run_number }}"
